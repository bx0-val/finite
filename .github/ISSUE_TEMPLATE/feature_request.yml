name: Feature request
description: A new metric, comparison, or dashboard idea.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Finite to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: What would it help you notice or change?
