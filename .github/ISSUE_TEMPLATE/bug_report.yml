name: Bug report
description: Something is counted wrong, missing, or broken.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did the dashboard show, and what did you expect?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 141 / Firefox 143
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Which X page?
      placeholder: Home (For you), a profile, search, a thread…
  - type: input
    id: version
    attributes:
      label: Finite version
      placeholder: 0.1.0
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, console errors (F12 → Console), steps to reproduce.
